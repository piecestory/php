name: Deploy

# Started by hand from GitHub (Actions → Deploy → Run workflow), choosing staging or production.
# Every check in ci.yml runs first; any failure stops the release. The server keeps the last
# three releases, and deploy/rollback.sh switches back in seconds.
#
# Per GitHub environment ("staging", "production") these secrets are required:
#   SSH_HOST, SSH_PORT (Hostinger: 65002), SSH_USER, SSH_PRIVATE_KEY, DEPLOY_PATH (e.g. /home/u123/domains/piecenstory.com)
# and these variables: APP_URL (health check after the switch), PHP_BIN (Hostinger: /opt/alt/php84/usr/bin/php).

on:
  workflow_dispatch:
    inputs:
      target:
        description: Where to deploy
        type: choice
        options: [staging, production]
        default: staging

concurrency:
  group: deploy-${{ inputs.target }}
  cancel-in-progress: false

jobs:
  checks:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: checks
    runs-on: ubuntu-latest
    environment: ${{ inputs.target }}
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_mysql, gd, intl, zip, exif, fileinfo
          coverage: none

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      # Production dependencies only; Filament's assets are published by composer's post-install hook.
      - run: composer install --no-dev --optimize-autoloader --no-interaction --prefer-dist --no-progress
      - run: npm ci && npm run build

      - name: Upload and switch
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          PHP_BIN: ${{ vars.PHP_BIN }}
        run: |
          install -m 700 -d ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key && chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "$SSH_PORT" "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          SSH_KEY=~/.ssh/deploy_key bash deploy/ship.sh "$SSH_USER@$SSH_HOST" "$SSH_PORT" "$DEPLOY_PATH" "${PHP_BIN:-php}"

      - name: Health check (rolls back if the site does not answer)
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          APP_URL: ${{ vars.APP_URL }}
        run: |
          for i in 1 2 3 4 5 6; do
            if curl -fsS -o /dev/null --max-time 15 "$APP_URL/up" && curl -fsS -o /dev/null --max-time 15 "$APP_URL/"; then
              echo "Site is up."; exit 0
            fi
            sleep 10
          done
          echo "Site did not answer: rolling back."
          ssh -i ~/.ssh/deploy_key -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" "PHP_BIN='${{ vars.PHP_BIN }}' bash '$DEPLOY_PATH/current/deploy/rollback.sh' '$DEPLOY_PATH'"
          exit 1
